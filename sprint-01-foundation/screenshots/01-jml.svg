<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="202" viewBox="0 0 1200 202" role="img"><title>JML lifecycle · proposed</title><rect width="1200" height="202" rx="16" fill="#102238"/><g font-family="system-ui,sans-serif"><text x="32" y="52" fill="#75e6c4" font-weight="700" font-size="30">JML lifecycle · proposed</text><text x="32" y="99" fill="#d9e7f5" font-size="19">01   JOINER   →   Verify owner and approval   →   Issue a scoped, expiring grant</text><text x="32" y="133" fill="#d9e7f5" font-size="19">02   MOVER   →   Revoke superseded access   →   Activate approved replacement grants</text><text x="32" y="167" fill="#d9e7f5" font-size="19">03   LEAVER   →   Disable identity and revoke grants   →   Reject prior sessions</text></g></svg>
